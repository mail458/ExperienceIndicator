[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datenputz"
version = "0.5.0"
description = "Privatsphäre-Werkzeugkasten: Datenhändler-Löschung (wie Incogni), Dark-Web-Monitor, DNS-Bedrohungsschutz, Link-/Datei-Check und eigenes WireGuard-VPN (wie NordVPN)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
datenputz = "datenputz.cli:main"

[tool.setuptools.packages.find]
include = ["datenputz*"]

[tool.setuptools.package-data]
"datenputz.data" = ["*.json"]
