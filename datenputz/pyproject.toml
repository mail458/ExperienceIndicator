[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datenputz"
version = "0.1.0"
description = "Löschanfragen nach DSGVO/CCPA automatisch an Datenhändler senden, nachverfolgen und wiederholen."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
datenputz = "datenputz.cli:main"

[tool.setuptools.packages.find]
include = ["datenputz*"]

[tool.setuptools.package-data]
"datenputz.data" = ["*.json"]
